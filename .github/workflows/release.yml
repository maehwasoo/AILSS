name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "1"
      LEFTHOOK: "0"
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      npm_config_devdir: ${{ github.workspace }}/.node-gyp

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.12"
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --directory apps/api --locked

      - name: Quality Gate
        run: pnpm check:ci

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate version consistency (service)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const version=process.env.VERSION; const pkg=JSON.parse(fs.readFileSync('packages/core/package.json','utf8')); if (pkg.version!==version) { console.error('version mismatch:', 'packages/core/package.json', pkg.version, '!=', version); process.exit(1); }"

      - name: Validate version consistency (plugin)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node -e "const fs=require('fs'); const version=process.env.VERSION; const manifest=JSON.parse(fs.readFileSync('packages/obsidian-plugin/manifest.json','utf8')); const pkg=JSON.parse(fs.readFileSync('packages/obsidian-plugin/package.json','utf8')); const versions=JSON.parse(fs.readFileSync('packages/obsidian-plugin/versions.json','utf8')); if (manifest.version!==version) {console.error('manifest.json version mismatch:', manifest.version, '!=', version); process.exit(1);} if (pkg.version!==version) {console.error('package.json version mismatch:', pkg.version, '!=', version); process.exit(1);} if (!Object.prototype.hasOwnProperty.call(versions, version)) {console.error('versions.json missing key:', version); process.exit(1);} "

      - name: Build plugin bundle
        run: pnpm -C packages/obsidian-plugin build

      - name: Stage service bundle
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          bundle_root="ailss-service-${VERSION}"
          stage="${RUNNER_TEMP}/${bundle_root}"

          mkdir -p "${stage}/apps/api"

          cat > "${stage}/README.md" <<'MD'
          # AILSS service bundle (Python runtime)

          This bundle contains the Python service app source used by the Obsidian plugin:

          - `apps/api` (Python-first local backend)

          ## Requirements

          - Python 3.12+
          - `uv`

          ## Install

          From the extracted folder:

          ```bash
          uv sync --directory apps/api --locked
          ```

          ## Run

          Python backend:

          ```bash
          uv run --directory apps/api ailss-api --help
          ```

          MCP (localhost HTTP):

          ```bash
          uv run --directory apps/api ailss-mcp-http
          ```

          Indexer:

          ```bash
          uv run --directory apps/api ailss-indexer --help
          ```
          MD

          cp "apps/api/README.md" "${stage}/apps/api/README.md"
          cp "apps/api/pyproject.toml" "${stage}/apps/api/pyproject.toml"
          cp "apps/api/uv.lock" "${stage}/apps/api/uv.lock"
          cp -R "apps/api/data" "${stage}/apps/api/data"
          cp -R "apps/api/src" "${stage}/apps/api/src"

      - name: Create unified release zip
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          out="ailss-${VERSION}.zip"
          stage="${RUNNER_TEMP}/ailss-${VERSION}"
          rm -rf "${stage}"
          mkdir -p "${stage}"

          cp "packages/obsidian-plugin/main.js" "${stage}/main.js"
          cp "packages/obsidian-plugin/manifest.json" "${stage}/manifest.json"
          cp "packages/obsidian-plugin/styles.css" "${stage}/styles.css"
          cp "packages/obsidian-plugin/versions.json" "${stage}/versions.json"

          service_stage="${RUNNER_TEMP}/ailss-service-${VERSION}"
          if [[ ! -d "${service_stage}" ]]; then
            echo "missing service bundle stage: ${service_stage}" >&2
            exit 1
          fi
          cp -R "${service_stage}" "${stage}/ailss-service"

          pushd "${stage}"
          zip -r "${GITHUB_WORKSPACE}/${out}" .
          popd

          ls -la "${out}"

      - name: Resolve previous stable tag
        id: stable_tag
        if: steps.meta.outputs.prerelease == 'false'
        shell: bash
        run: |
          current="${GITHUB_REF_NAME}"
          current_commit="$(git rev-list -n 1 "${current}")"
          previous=""

          while IFS= read -r tag; do
            tag_commit="$(git rev-list -n 1 "${tag}")"
            if git merge-base --is-ancestor "${tag_commit}" "${current_commit}"; then
              previous="${tag}"
              break
            fi
          done < <(
            git tag --list 'v*' --sort=-v:refname \
              | grep -Ev -- '-' \
              | grep -Fxv -- "${current}"
          )

          echo "previous=${previous}" >> "${GITHUB_OUTPUT}"

      - name: Generate stable release notes
        id: stable_notes
        if: steps.meta.outputs.prerelease == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const tagName = process.env.GITHUB_REF_NAME;
            const previousTag = `${{ steps.stable_tag.outputs.previous }}`.trim();
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              configuration_file_path: ".github/release.yml",
            };

            if (previousTag) {
              params.previous_tag_name = previousTag;
            }

            const response = await github.request(
              "POST /repos/{owner}/{repo}/releases/generate-notes",
              params
            );

            core.setOutput("body", response.data.body);

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: false
          body: ${{ steps.meta.outputs.prerelease == 'true' && 'Pre-release build' || steps.stable_notes.outputs.body }}
          files: |
            ailss-${{ steps.meta.outputs.version }}.zip
